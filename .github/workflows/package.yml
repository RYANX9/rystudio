name: package
on:
  push:
    branches: [main]
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r rystudio-ready.zip . -x ".git/*" "node_modules/*" ".next/*"
      - uses: actions/upload-artifact@v4
        with:
          name: rystudio-ready
          path: rystudio-ready.zip
